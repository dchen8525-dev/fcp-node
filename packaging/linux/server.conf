# FCP Node server configuration. Read by systemd as an EnvironmentFile.
#
# This file contains the pre-shared key in plaintext. Keep it 0640
# root:fcp-node; never commit a real key to a repository.
#
# The installer replaces CHANGE_ME_32_HEX_CHARS with a random key on first
# install and prints it once. Both ends must use the same 32 hex characters
# (16 bytes); to rotate, generate one with: openssl rand -hex 16
FCP_KEY=CHANGE_ME_32_HEX_CHARS

# UDP listen address. Ports below 1024 would need privileges; keep >= 1024.
FCP_BIND=0.0.0.0:4461

# PMTUD starts at mtu-min and walks up to mtu-max. Both ends must agree.
FCP_MTU_MIN=1040
FCP_MTU_MAX=1500

# Frame geometry. P is the parity ceiling the adaptive controller may use.
FCP_FEC=10:6

# debug|info|warn|error|off
FCP_LOG_LEVEL=info
FCP_LOG_FILE=/var/log/fcp-node/server.log
