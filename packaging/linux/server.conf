# FCP Server configuration. Read by systemd as an EnvironmentFile.
#
# This file contains the pre-shared key in plaintext. Keep it 0640
# root:fcp-server; never commit a real key to a repository.
#
# The installer replaces CHANGE_ME_32_HEX_CHARS with a random key on first
# install and prints it once. Both ends must use the same 32 hex characters
# (16 bytes); to rotate, generate one with: openssl rand -hex 16
FCP_KEY=CHANGE_ME_32_HEX_CHARS

# Refuse proxy OPEN targets in the server's own private/loopback/link-local
# networks. Keep 1 when the PSK is shared; set 0 only for a personal tunnel that
# intentionally reaches the server's LAN.
FCP_DENY_PRIVATE=1

# UDP listen address. Ports below 1024 would need privileges; keep >= 1024.
FCP_BIND=0.0.0.0:4461

# PMTUD probe start (floor). The walk's ceiling follows automatically: 1500,
# or this value when it is higher. Both ends must agree.
FCP_MTU_MIN=1040

# Frame geometry. FCP_FEC_PARITY_MAX is the parity ceiling the adaptive
# controller may use; FCP_FEC_DATA is the data symbols per repair set. Both ends
# must agree, and the two must not add up to more than 256.
# (The old single FCP_FEC=10:6 is gone: the launcher refuses it rather than
# guessing which half is which.)
FCP_FEC_DATA=10
FCP_FEC_PARITY_MAX=6

# debug|info|warn|error|off
FCP_LOG_LEVEL=info
FCP_LOG_FILE=/var/log/fcp-server/server.log

# Resolvers for protocol-internal DNS (oob FCP_DNS1). A TUN-mode client cannot
# see domain names (only IP packets) and often cannot reach public resolvers, so
# it asks the server over the tunnel. Leave empty to use this host's resolver
# list - the same one OPEN(domain) uses, so both paths always agree.
# Format: comma-separated IPv4 addresses, e.g. 1.1.1.1,8.8.8.8
#FCP_DNS_UPSTREAM=
