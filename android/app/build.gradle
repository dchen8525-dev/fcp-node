plugins {
    id 'com.android.application'
}

// 版本号的唯一来源是仓库根的 package.json（与 deb / SEA exe / desktop 一致）。
// 这里派生而不是复制，避免发布时要在第四个地方再改一次：
//   versionName = "0.0.27"
//   versionCode = major*1_000_000 + minor*10_000 + patch*100
//                 （低位留给 hotfix / 重建，0.0.27 -> 2700）
def rootPkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
def verParts = rootPkg.version.tokenize('.')
if (verParts.size() != 3) {
    throw new GradleException("package.json version must be MAJOR.MINOR.PATCH, got '${rootPkg.version}'")
}
def vMajor = verParts[0] as int
def vMinor = verParts[1] as int
def vPatch = verParts[2] as int
def derivedVersionName = rootPkg.version as String
def derivedVersionCode = vMajor * 1_000_000 + vMinor * 10_000 + vPatch * 100

// 正式签名走环境变量（CI secrets）；没有就退回 debug keystore，让 release APK
// 仍可直接安装 —— 内部分发场景下 unsigned APK 是没法用的。
def releaseKeystore = System.getenv('FCP_ANDROID_KEYSTORE')

android {
    namespace 'com.dchen.fcpvpn'
    compileSdk 34
    // 显式固定 build-tools 版本：不写时 AGP 用自己的默认值，会随 AGP 升级漂移。
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.dchen.fcpvpn"
        minSdk 30  // Android 11
        targetSdk 34
        versionCode derivedVersionCode
        versionName derivedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('FCP_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FCP_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('FCP_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "DEFAULT_LOG_LEVEL", "\"DEBUG\""
            buildConfigField "boolean", "PACKET_TRACE_ENABLED", "true"
        }
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            buildConfigField "String", "DEFAULT_LOG_LEVEL", "\"INFO\""
            buildConfigField "boolean", "PACKET_TRACE_ENABLED", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // 测试
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
